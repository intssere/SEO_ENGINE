# F14 INERT SPECIFICATION ONLY.
# This file is intentionally outside .github/workflows and declares no event trigger.
# It must not be moved into .github/workflows or executed without a fresh explicit authorization.
name: P8.8 W09-C3F-A-F14 inert OCI release specification

on: []

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: intssere/seo-engine

jobs:
  release:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push exact single-platform image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            EXPECTED_CANONICAL_COMMIT=${{ github.sha }}
            EXPECTED_CANONICAL_TREE=${{ env.EXPECTED_CANONICAL_TREE }}
            EXPECTED_SOURCE_BRANCH=${{ github.ref_name }}
          tags: ghcr.io/intssere/seo-engine:sha-${{ github.sha }}

      - name: Attest exact pushed digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/intssere/seo-engine
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
