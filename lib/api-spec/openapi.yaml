openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Load the SEO operations dashboard
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 28, 90] } }
        - { name: country, in: query, schema: { type: string } }
        - { name: device, in: query, schema: { type: string, enum: [all, desktop, mobile, tablet] } }
      responses:
        "200":
          description: Current dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"
  /pilot/authorization:
    get:
      operationId: getPilotAuthorization
      tags: [dashboard]
      summary: Issue a short-lived same-origin pilot action capability
      responses:
        "200":
          description: Short-lived authorization capability
          content:
            application/json:
              schema:
                type: object
                required: [authorization]
                properties:
                  authorization: { type: string }
  /pilot/status:
    get:
      operationId: getPilotStatus
      tags: [dashboard]
      summary: Load sanitized pilot run status
      responses:
        "200":
          description: Current pilot run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotRunStatus"
  /pilot/run:
    post:
      operationId: startPilotRun
      tags: [dashboard]
      summary: Queue a guarded read-only Diamond Shelf pilot run
      parameters:
        - name: x-pilot-authorization
          in: header
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Pilot run queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotRunRequest"
        "409":
          description: A pilot run is already queued or running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotRunRequest"
        "412":
          description: Pilot preflight failed closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotRunRequest"
  /performance:
    get:
      operationId: getPerformance
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 28, 90] } }
        - { name: country, in: query, schema: { type: string } }
        - { name: device, in: query, schema: { type: string, enum: [all, desktop, mobile, tablet] } }
      responses:
        "200": { description: Performance data, content: { application/json: { schema: { $ref: "#/components/schemas/OperationalResponse" } } } }
  /opportunities:
    get: { operationId: listOpportunities, responses: { "200": { description: Active and historical evidence-backed opportunities, content: { application/json: { schema: { $ref: "#/components/schemas/OpportunityResponse" } } } } } }
  /actions:
    get: { operationId: listActions, responses: { "200": { description: Actions, content: { application/json: { schema: { $ref: "#/components/schemas/OperationalResponse" } } } } } }
  /approvals:
    get: { operationId: listApprovals, responses: { "200": { description: Approvals, content: { application/json: { schema: { $ref: "#/components/schemas/OperationalResponse" } } } } } }
  /deployments:
    get: { operationId: listDeployments, responses: { "200": { description: Deployments, content: { application/json: { schema: { $ref: "#/components/schemas/OperationalResponse" } } } } } }
  /technical-seo:
    get: { operationId: listTechnicalFindings, responses: { "200": { description: Findings, content: { application/json: { schema: { $ref: "#/components/schemas/OperationalResponse" } } } } } }
  /command:
    post:
      operationId: askSeoEngine
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [question], properties: { question: { type: string } } } } }
      responses:
        "200": { description: Read-only answer, content: { application/json: { schema: { type: object, properties: { answer: { type: string } } } } } }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OperationalResponse:
      type: object
      properties:
        readiness: { type: object }
        rows: { type: array, items: { type: object, additionalProperties: true } }
      required: [readiness, rows]
    OpportunityRecord:
      type: object
      required: [id, title, opportunity_type, score, status, rationale, evidence_count, url, query, risk_classification, confidence, score_components, why_qualifies, recommendation, execution_authorized, lifecycle, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        opportunity_type: { type: string, enum: [organic_ctr, striking_distance, technical_remediation, internal_link, content_alignment] }
        score: { type: number }
        status: { type: string, enum: [new, accepted, dismissed, planned, completed] }
        rationale: { type: string }
        evidence_count: { type: integer }
        url: { type: [string, "null"] }
        query: { type: [string, "null"] }
        risk_classification: { type: string, enum: [low, medium, high, unclassified] }
        confidence: { type: number }
        score_components: { type: object, additionalProperties: true }
        why_qualifies: { type: string }
        recommendation: { type: string }
        execution_authorized: { type: boolean }
        lifecycle: { type: string, enum: [active, invalidated_or_superseded] }
        updated_at: { type: string }
    OpportunityResponse:
      type: object
      required: [readiness, rows, history]
      properties:
        readiness: { type: object }
        rows:
          type: array
          items: { $ref: "#/components/schemas/OpportunityRecord" }
        history:
          type: array
          items: { $ref: "#/components/schemas/OpportunityRecord" }
    PilotCounts:
      type: object
      required: [products, catalogProducts, productsObserved, shopifyComplete, gscRows, gscDetailedRows, ga4Rows, pages, findings, opportunities]
      properties:
        products: { type: integer }
        catalogProducts: { type: integer }
        productsObserved: { type: integer }
        shopifyComplete: { type: boolean }
        gscRows: { type: integer }
        gscDetailedRows: { type: integer }
        ga4Rows: { type: integer }
        pages: { type: integer }
        findings: { type: integer }
        opportunities: { type: integer }
    PilotProviderDiagnostic:
      type: object
      required: [status, category, httpStatus]
      properties:
        status:
          type: string
          enum: [available, empty, failed]
        category: { type: [string, "null"] }
        httpStatus: { type: [integer, "null"] }
    PilotDiagnostics:
      type: object
      required: [shopify, gsc, gscAggregate, ga4, crawl]
      properties:
        shopify: { $ref: "#/components/schemas/PilotProviderDiagnostic" }
        gsc: { $ref: "#/components/schemas/PilotProviderDiagnostic" }
        gscAggregate: { $ref: "#/components/schemas/PilotProviderDiagnostic" }
        ga4: { $ref: "#/components/schemas/PilotProviderDiagnostic" }
        crawl: { $ref: "#/components/schemas/PilotProviderDiagnostic" }
    GscAggregateMetrics:
      type: object
      required: [clicks, impressions, ctr, position]
      properties:
        clicks: { type: number }
        impressions: { type: number }
        ctr: { type: number }
        position: { type: [number, "null"] }
    GscReconciliation:
      type: object
      required: [status, detailedClicks, detailedImpressions, clickCoverage, impressionCoverage]
      properties:
        status:
          type: string
          enum: [consistent, partial_dimensional, inconsistent, aggregate_unavailable]
        detailedClicks: { type: number }
        detailedImpressions: { type: number }
        clickCoverage: { type: [number, "null"] }
        impressionCoverage: { type: [number, "null"] }
    BaselineCertification:
      type: object
      required: [status, wholeSiteCertified, wholeSiteReason, crawlCoverage, technicalFindings, gscAggregate]
      properties:
        status:
          type: string
          enum: [pilot_ready, partial]
        wholeSiteCertified: { type: boolean }
        wholeSiteReason:
          type: string
          enum: [bounded_crawl]
        crawlCoverage:
          type: object
          required: [fetched, discovered, percent, boundedLimit, truncated]
          properties:
            fetched: { type: integer }
            discovered: { type: integer }
            percent: { type: number }
            boundedLimit: { type: integer }
            truncated: { type: boolean }
        technicalFindings:
          type: object
          required: [total, withValidEvidence, valid]
          properties:
            total: { type: integer }
            withValidEvidence: { type: integer }
            valid: { type: boolean }
        gscAggregate:
          type: object
          required: [status, metrics, reconciliation]
          properties:
            status:
              type: string
              enum: [available, failed]
            metrics:
              oneOf:
                - $ref: "#/components/schemas/GscAggregateMetrics"
                - type: "null"
            reconciliation:
              $ref: "#/components/schemas/GscReconciliation"
    DashboardCertification:
      type: object
      required: [status, wholeSiteCertified, wholeSiteReason, crawlCoverage, technicalFindings, gscAggregate]
      properties:
        status:
          type: string
          enum: [not_evaluated, pilot_ready, partial]
        wholeSiteCertified: { type: boolean }
        wholeSiteReason: { type: [string, "null"] }
        crawlCoverage:
          type: object
          required: [fetched, discovered, percent, boundedLimit, truncated]
          properties:
            fetched: { type: integer }
            discovered: { type: integer }
            percent: { type: number }
            boundedLimit: { type: integer }
            truncated: { type: boolean }
        technicalFindings:
          type: object
          required: [total, withValidEvidence, valid]
          properties:
            total: { type: integer }
            withValidEvidence: { type: integer }
            valid: { type: boolean }
        gscAggregate:
          type: object
          required: [status, metrics, reconciliation]
          properties:
            status:
              type: string
              enum: [not_evaluated, available, failed]
            metrics:
              oneOf:
                - $ref: "#/components/schemas/GscAggregateMetrics"
                - type: "null"
            reconciliation:
              $ref: "#/components/schemas/GscReconciliation"
    PilotRunStatus:
      type: object
      required: [runId, status, phase, readiness, freshness, blockers, counts, diagnostics, certification, error]
      properties:
        runId: { type: [string, "null"] }
        status:
          type: string
          enum: [not_started, queued, running, completed, partial, failed]
        phase: { type: string }
        readiness:
          type: string
          enum: [not_evaluated, ready, partial]
        freshness: { type: [string, "null"] }
        blockers:
          type: array
          items: { type: string }
        counts:
          $ref: "#/components/schemas/PilotCounts"
        diagnostics:
          $ref: "#/components/schemas/PilotDiagnostics"
        certification:
          oneOf:
            - $ref: "#/components/schemas/BaselineCertification"
            - type: "null"
        error: { type: [string, "null"] }
    PilotRunRequest:
      type: object
      required: [accepted, runId, status, error]
      properties:
        accepted: { type: boolean }
        runId: { type: [string, "null"] }
        status:
          type: string
          enum: [queued, running, failed]
        error: { type: [string, "null"] }
    DashboardMetric:
      type: object
      required: [label, value, delta]
      properties:
        label: { type: string }
        value: { type: string }
        delta: { type: string }
    DashboardOpportunity:
      type: object
      required: [title, score, evidence, risk, state]
      properties:
        title: { type: string }
        score: { type: string }
        evidence: { type: string }
        risk: { type: string }
        state: { type: string }
    DashboardActivity:
      type: object
      required: [title, detail, result, tone]
      properties:
        title: { type: string }
        detail: { type: string }
        result: { type: string }
        tone:
          type: string
          enum: [verified, ready, approval, normal]
    DashboardSnapshot:
      type: object
      required: [state, reason, siteName, domain, generatedAt, dataFreshness, stale, approvalsPending, metrics, engine, opportunities, activity, verification, aiVisibility, learning, impact, pilot]
      properties:
        state:
          type: string
          enum: [live, unavailable]
        reason:
          type: [string, "null"]
        siteName: { type: string }
        domain: { type: string }
        generatedAt: { type: string }
        dataFreshness: { type: string }
        stale: { type: boolean }
        approvalsPending: { type: integer }
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/DashboardMetric"
        engine:
          type: object
          required: [pagesAnalyzed, opportunities, actionsPrepared, executed, verified, regressions]
          properties:
            pagesAnalyzed: { type: integer }
            opportunities: { type: integer }
            actionsPrepared: { type: integer }
            executed: { type: integer }
            verified: { type: integer }
            regressions: { type: integer }
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/DashboardOpportunity"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/DashboardActivity"
        verification:
          type: object
          required: [verified, total, pending, rolledBack, regressions]
          properties:
            verified: { type: integer }
            total: { type: integer }
            pending: { type: integer }
            rolledBack: { type: integer }
            regressions: { type: integer }
        aiVisibility:
          type: object
          required: [citationRate, brandMentionRate, citationShare]
          properties:
            citationRate: { type: string }
            brandMentionRate: { type: string }
            citationShare: { type: string }
        learning:
          type: object
          required: [signalCount, averageConfidence]
          properties:
            signalCount: { type: integer }
            averageConfidence: { type: string }
        impact:
          type: object
          required: [verifiedOptimizations, completedExperiments, rollbacks, regressionsDetected]
          properties:
            verifiedOptimizations: { type: integer }
            completedExperiments: { type: integer }
            rollbacks: { type: integer }
            regressionsDetected: { type: integer }
        pilot:
          type: object
          required: [status, readiness, phase, freshness, blockers, counts, diagnostics, certification]
          properties:
            status:
              type: string
              enum: [not_started, queued, running, completed, partial, failed]
            readiness:
              type: string
              enum: [not_evaluated, ready, partial]
            phase: { type: string }
            freshness:
              type: [string, "null"]
            blockers:
              type: array
              items: { type: string }
            counts:
              $ref: "#/components/schemas/PilotCounts"
            diagnostics:
              $ref: "#/components/schemas/PilotDiagnostics"
            certification:
              $ref: "#/components/schemas/DashboardCertification"

