name: PILOT-01 RT01-A12.25 independent provenance certification offline
on:
  pull_request:
    paths:
      - '.github/workflows/pilot-01-rt01a12-25-provenance-offline.yml'
      - 'lib/db/src/pilot-01-rt01a12-25-*'
      - 'lib/db/src/pilot-01-rt01a12-24-disconnected-evidence-gate*'
      - 'lib/db/src/pilot-01-rt01a12-23-migration-lineage-gate*'
      - 'docs/pilot-01-rt01a12-25-provenance-cert-design.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-provenance-and-history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify A12.23-A12.25 existing and new offline gates
        run: pnpm --filter @workspace/db exec tsx --test src/pilot-01-rt01a12-23-migration-lineage-gate.test.ts src/pilot-01-rt01a12-24-disconnected-evidence-gate.test.ts src/pilot-01-rt01a12-25-provenance-cert-design.test.ts
