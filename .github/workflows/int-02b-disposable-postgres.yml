name: INT-02B disposable PostgreSQL migration compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - "lib/db/migrations/001[2-5]_ugp_*.sql"
      - ".github/workflows/int-02b-disposable-postgres.yml"
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: seo_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d seo_engine_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: seo_engine_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Install isolated combined schema in disposable service
        shell: bash
        run: |
          set -euo pipefail
          for file in lib/db/migrations/00{01..15}_*.sql; do
            test -f "$file"
            echo "TEST_APPLY ${file##*/}"
            psql -X -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
          count="$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
          echo "Combined table count: $count"
          test "$count" -eq 55
          psql -X -v ON_ERROR_STOP=1 -c "SELECT conname FROM pg_constraint WHERE conname='ua_single_send_exec_event_reason_v2_check'" | grep ua_single_send_exec_event_reason_v2_check
          echo "INT_02B_COMBINED_DISPOSABLE_POSTGRES_PASS"
      - name: Verify installation replay fails closed and preserves installed schema
        shell: bash
        run: |
          set -euo pipefail
          before="$(psql -X -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
          if psql -X -v ON_ERROR_STOP=1 -f lib/db/migrations/0012_ugp_10_3_authority_outreach_review_events.sql >/tmp/int02-replay.log 2>&1; then
            echo "ERROR: repeated migration unexpectedly succeeded"; exit 1
          fi
          after="$(psql -X -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
          test "$before" = "55" && test "$after" = "$before"
          psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_constraint WHERE conname='ua_single_send_exec_event_reason_v2_check'" | grep -qx 1
          echo "INT_02B_REPLAY_REFUSED_SCHEMA_UNCHANGED"
      - name: Verify constraint migration rejects missing prerequisite
        shell: bash
        run: |
          set -euo pipefail
          createdb int02_missing_prerequisite
          if PGDATABASE=int02_missing_prerequisite psql -X -v ON_ERROR_STOP=1 -f lib/db/migrations/0015_ugp_10_33_controlled_https_certification.sql >/tmp/int02-missing.log 2>&1; then
            echo "ERROR: 0015 unexpectedly accepted invalid prerequisite"; exit 1
          fi
          echo "INT_02B_MISSING_PREREQUISITE_REFUSED"
      - name: Reject out-of-order migration against main-only baseline
        shell: bash
        run: |
          set -euo pipefail
          createdb int02_main_only
          for file in lib/db/migrations/00{01..11}_*.sql; do
            PGDATABASE=int02_main_only psql -X -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
          before="$(PGDATABASE=int02_main_only psql -X -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
          test "$before" -eq 49
          if PGDATABASE=int02_main_only psql -X -v ON_ERROR_STOP=1 -f lib/db/migrations/0014_ugp_10_32_single_send_execution.sql >/tmp/int02-order.log 2>&1; then
            echo "ERROR: 0014 succeeded without 0013 reservation prerequisite"; exit 1
          fi
          after="$(PGDATABASE=int02_main_only psql -X -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
          test "$after" = "$before"
          echo "INT_02B_OUT_OF_ORDER_REFUSED_MAIN_BASELINE_PRESERVED"
      - name: Verify partial UGP installation remains incomplete and rejects 0015
        shell: bash
        run: |
          set -euo pipefail
          createdb int02_partial_ugp
          for file in lib/db/migrations/00{01..13}_*.sql; do
            PGDATABASE=int02_partial_ugp psql -X -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
          before="$(PGDATABASE=int02_partial_ugp psql -X -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
          test "$before" -eq 53
          if PGDATABASE=int02_partial_ugp psql -X -v ON_ERROR_STOP=1 -f lib/db/migrations/0015_ugp_10_33_controlled_https_certification.sql >/tmp/int02-partial.log 2>&1; then
            echo "ERROR: 0015 succeeded before required 0014 tables"; exit 1
          fi
          after="$(PGDATABASE=int02_partial_ugp psql -X -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
          test "$after" = "$before"
          echo "INT_02B_PARTIAL_SCHEMA_REJECTED_AND_PRESERVED"
      - name: Verify observed schema evidence drives fail-closed admission decisions
        shell: bash
        run: |
          set -euo pipefail
          for db in seo_engine_test int02_main_only int02_partial_ugp; do
            names="$(PGDATABASE="$db" psql -X -At -v ON_ERROR_STOP=1 -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' ORDER BY table_name")"
            count="$(printf '%s\n' "$names" | wc -l | tr -d ' ')"
            final="$(PGDATABASE="$db" psql -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_constraint WHERE conname='ua_single_send_exec_event_reason_v2_check'")"
            snapshot="$(PGDATABASE="$db" psql -X -At -v ON_ERROR_STOP=1 -c "SELECT json_agg(table_name ORDER BY table_name)::text FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
            SNAPSHOT="$snapshot" TABLE_COUNT="$count" FINAL_CONSTRAINT="$final" DB_NAME="$db" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { assessMigrationAdmission } from './docs/integration/int-02b-migration-admission.mjs';
          const observed=JSON.parse(process.env.SNAPSHOT);
          const result=assessMigrationAdmission({
            tableCount:Number(process.env.TABLE_COUNT),
            tableNames:observed,
            hasFinalConstraint:process.env.FINAL_CONSTRAINT==='1',
            sourceHashesVerified:false,
            installedLineageVerified:false,
            targetDatabaseIdentityVerified:false,
            authorizedDisposableExecution:false
          });
          assert.equal(result.admitted,false);
          const expected={seo_engine_test:'already_installed_no_replay',int02_main_only:'source_integrity_unverified',int02_partial_ugp:'unrecognized_or_partial_lineage'};
          assert.equal(result.reason,expected[process.env.DB_NAME],process.env.DB_NAME);
          console.log('INT02_LIVE_SNAPSHOT_REJECTED',process.env.DB_NAME,result.reason);
          JS
          done
      - name: Evaluate attested read-only database catalog observations
        shell: bash
        run: |
          set -euo pipefail
          createdb int02_attested
          for file in lib/db/migrations/00{01..11}_*.sql; do
            PGDATABASE=int02_attested psql -X -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
          DB_NAME="$(PGDATABASE=int02_attested psql -X -At -c "SELECT current_database()")"
          ACTUAL_TABLES="$(PGDATABASE=int02_attested psql -X -At -c "SELECT coalesce(json_agg(table_name ORDER BY table_name),'[]'::json)::text FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
          ACTUAL_CONSTRAINTS="$(PGDATABASE=int02_attested psql -X -At -c "SELECT coalesce(json_agg(conname ORDER BY conname),'[]'::json)::text FROM pg_constraint WHERE connamespace='public'::regnamespace")"
          BASE_SHA="$(sha256sum lib/db/migrations/0011_first_party_crawl_expected_absence_disposition.sql | cut -d ' ' -f1)"
          DB_NAME="$DB_NAME" ACTUAL_TABLES="$ACTUAL_TABLES" ACTUAL_CONSTRAINTS="$ACTUAL_CONSTRAINTS" BASE_SHA="$BASE_SHA" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {verifyDisposableLineageEvidence} from './docs/integration/int-02b-migration-admission.mjs';
          import {PINNED_MAIN_TABLES} from './docs/integration/int-02b-main-schema-source-baseline.mjs';
          const observedTables=JSON.parse(process.env.ACTUAL_TABLES);
          const observedConstraints=JSON.parse(process.env.ACTUAL_CONSTRAINTS);
          const migrationSource=readFileSync('lib/db/migrations/0011_first_party_crawl_expected_absence_disposition.sql','utf8');
          const input={observedTables,observedConstraints,expectedTables:PINNED_MAIN_TABLES,databaseName:process.env.DB_NAME,expectedDatabaseName:'int02_attested',migrationSource,expectedSourceSha256:process.env.BASE_SHA};
          assert.equal(verifyDisposableLineageEvidence(input).verified,true);
          assert.equal(verifyDisposableLineageEvidence({...input,databaseName:'unknown_database'}).verified,false);
          assert.equal(verifyDisposableLineageEvidence({...input,migrationSource:migrationSource+'--altered'}).verified,false);
          assert.equal(verifyDisposableLineageEvidence({...input,expectedTables:[...observedTables.slice(1),'forged_table']}).verified,false);
          console.log('INT02_DISPOSABLE_CATALOG_EVIDENCE_PASS',observedTables.length,observedConstraints.length);
          JS
