name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seo_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seo_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate PostgreSQL schema
        run: |
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -v ON_ERROR_STOP=1 -f packages/db/migrations/0001_core.sql
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" | grep -q '^29$'

      - name: Test Shopify read-only safety contract
        run: pnpm --filter @seo-engine/shopify test

      - name: Test crawler extraction and URL normalization
        run: pnpm --filter @seo-engine/crawler test

      - name: Test Google read-only ingestion normalization
        run: pnpm --filter @seo-engine/google-ingestion test

      - name: Test provider-neutral OpenSEO adapter
        run: pnpm --filter @seo-engine/seo-data test

      - name: Test canonical evidence normalization
        run: pnpm --filter @seo-engine/evidence-normalizer test

      - name: Test deterministic technical SEO findings
        run: pnpm --filter @seo-engine/technical-seo test

      - name: Test ranking accelerator opportunities
        run: pnpm --filter @seo-engine/ranking-accelerator test

      - name: Test unified opportunity engine
        run: pnpm --filter @seo-engine/opportunity-engine test

      - name: Test internal-link intelligence
        run: pnpm --filter @seo-engine/internal-link-intelligence test

      - name: Test GEO and AI visibility normalization
        run: pnpm --filter @seo-engine/ai-visibility test

      - name: Test search intelligence policy normalization
        run: pnpm --filter @seo-engine/search-intelligence test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
