name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seo_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seo_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate legacy PostgreSQL core schema
        run: |
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -v ON_ERROR_STOP=1 -f lib/db/migrations/0001_core.sql
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^29$'

      - name: Test Task #55 runtime auth migration and database bootstrap
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_test
        run: |
          pnpm --filter @workspace/db test:bootstrap
          pnpm db:bootstrap
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^31$'
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT to_regclass('public.auth_sessions') IS NOT NULL AND to_regclass('public.auth_audit_events') IS NOT NULL" | grep -q '^t$'
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT domain FROM sites WHERE domain='diamondshelf.us' AND is_active=true" | grep -q '^diamondshelf.us$'

      - name: Test P3.6 observation/evidence schema migration
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_test
        run: |
          pnpm --filter @workspace/db test:p3-6
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^34$'

      - name: Test P12.2 crawl execution-state migration and persistence
        env:
          P12_2_EPHEMERAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_test
        run: |
          pnpm --filter @workspace/db test:p12-2
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^37$'
          pnpm --filter @workspace/api-server test:p12-2-persistence-ephemeral

      - name: Test P8.8 W04 reservation migration and PostgreSQL concurrency
        env:
          P8_8_W04_EPHEMERAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_test
        run: |
          pnpm --filter @workspace/db test:p8-8-w04
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^38$'
          pnpm --filter @workspace/api-server test:p8-8-w04-persistence-ephemeral

      - name: Test P8.8 W05 mutation-control migration and PostgreSQL concurrency
        env:
          P8_8_W05_EPHEMERAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_test
        run: |
          pnpm --filter @workspace/db test:p8-8-w05
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^41$'
          pnpm --filter @workspace/api-server test:p8-8-w05-persistence-ephemeral

      - name: Test P8.8 W06 read-only preflight persistence and race certification
        env:
          P8_8_W06_EPHEMERAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_test
        run: |
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^41$'
          pnpm --filter @workspace/api-server test:p8-8-w06-persistence-ephemeral
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^41$'

      - name: Test P8.8 W07 dispatch migration, PostgreSQL fencing and safety closure
        env:
          P8_8_W07_EPHEMERAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_test
        run: |
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^41$'
          pnpm --filter @workspace/db test:p8-8-w07
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^43$'
          pnpm --filter @workspace/api-server test:p8-8-w07-persistence-ephemeral
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^43$'

      - name: Test P8.8 W09-B synthetic read-only acquisition certification
        env:
          P8_8_W09B_EPHEMERAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_test
        run: |
          pnpm --filter @workspace/api-server test:p8-8-w09b-evidence-ephemeral
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^43$'

      - name: Test P12.2-L6 durable L2 invocation migration and receipt store
        env:
          P12_2_L6_EPHEMERAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_test
        run: |
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^43$'
          pnpm --filter @workspace/db test:p12-2-l6
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -q '^44$'
          pnpm --filter @workspace/api-server test:p12-2-l6-durable-ephemeral
          psql -h 127.0.0.1 -U postgres -d seo_engine_test -Atc "SELECT count(*) FROM first_party_crawl_l2_invocations" | grep -q '^1$'

      - name: Prepare P12.2 Production-lineage ephemeral database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_p12_2_prod_lineage_test
        run: |
          createdb -h 127.0.0.1 -U postgres seo_engine_p12_2_prod_lineage_test
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -v ON_ERROR_STOP=1 -f lib/db/migrations/0001_core.sql
          pnpm db:bootstrap
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -v ON_ERROR_STOP=1 -c "UPDATE sites SET id='eb1da9ee-539c-4200-8f04-f64ccaea7768'::uuid WHERE lower(domain)='diamondshelf.us' AND canonical_origin='https://diamondshelf.us' AND is_active=true"
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT id::text FROM sites WHERE lower(domain)='diamondshelf.us' AND canonical_origin='https://diamondshelf.us' AND is_active=true" | grep -Fxq eb1da9ee-539c-4200-8f04-f64ccaea7768
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -v ON_ERROR_STOP=1 -f lib/db/migrations/0003_observation_evidence_schema.sql
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -v ON_ERROR_STOP=1 -f lib/db/migrations/0004_first_party_crawl_execution_state.sql
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -v ON_ERROR_STOP=1 -f lib/db/migrations/0008_first_party_crawl_l2_invocations.sql
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -v ON_ERROR_STOP=1 -f lib/db/migrations/0009_first_party_crawl_l2_bounded_pilot_phase.sql
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -Fxq 38
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('policy_mutation_reservations','policy_mutation_control_state','policy_mutation_control_events','policy_mutation_claims','policy_mutation_dispatches','policy_mutation_dispatch_events')" | grep -Fxq 0
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT pg_get_constraintdef(con.oid,true) FROM pg_catalog.pg_constraint con JOIN pg_catalog.pg_class c ON c.oid=con.conrelid JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname='first_party_crawl_l2_invocations' AND con.conname='first_party_crawl_l2_invocations_phase_check'" | grep -q bounded_pilot

      - name: Test P12.2-L10.13B Production-lineage terminal failure recovery persistence
        env:
          P12_2_L10_13B_EPHEMERAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_p12_2_prod_lineage_test
        run: |
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -Fxq 38
          pnpm --filter @workspace/db test:p12-2-l10-13b
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -Fxq 41
          pnpm --filter @workspace/api-server test:p12-2-l10-13b-persistence-ephemeral
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -Fxq 41
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('policy_mutation_reservations','policy_mutation_control_state','policy_mutation_control_events','policy_mutation_claims','policy_mutation_dispatches','policy_mutation_dispatch_events')" | grep -Fxq 0

      - name: Test P12.2-L10.19 Production-lineage expected-absence disposition schema
        env:
          P12_2_L10_19_EPHEMERAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_p12_2_prod_lineage_test
        run: |
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -Fxq 41
          pnpm --filter @workspace/db test:p12-2-l10-19
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -Fxq 43
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('policy_mutation_reservations','policy_mutation_control_state','policy_mutation_control_events','policy_mutation_claims','policy_mutation_dispatches','policy_mutation_dispatch_events')" | grep -Fxq 0

      - name: Test P12.2-L10.21 durable expected-absence loader
        env:
          P12_2_L10_21_EPHEMERAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_p12_2_prod_lineage_test
        run: |
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -Fxq 43
          pnpm --filter @workspace/api-server test:p12-2-l10-21-persistence-ephemeral
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -Fxq 43

      - name: Test P12.2-L10.23 durable comparable history baseline selector
        env:
          P12_2_L10_23_EPHEMERAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/seo_engine_p12_2_prod_lineage_test
        run: |
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -Fxq 43
          pnpm --filter @workspace/api-server test:p12-2-l10-23-comparable-baseline-ephemeral
          psql -h 127.0.0.1 -U postgres -d seo_engine_p12_2_prod_lineage_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" | grep -Fxq 43

      - name: Test all current workspace packages
        run: pnpm -r --if-present test

      - name: Test P11.10 synthetic load scale
        run: pnpm --filter @workspace/api-server test:scale

      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/seo-engine exec playwright install --with-deps chromium

      - name: Test P4.10 browser critical paths
        run: pnpm --filter @workspace/seo-engine test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p4-10-playwright-artifacts
          path: |
            artifacts/seo-engine/playwright-report
            artifacts/seo-engine/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Typecheck
        run: pnpm typecheck

      - name: Prepare explicit W09-C2G build provenance identity
        run: |
          echo "EXPECTED_CANONICAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "EXPECTED_CANONICAL_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          echo "EXPECTED_SOURCE_BRANCH=ci-build" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build