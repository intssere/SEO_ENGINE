name: INT-02C-05A offline metadata query contract

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/integration/int-02c-05a-railway-metadata-query-contract.mjs"
      - "docs/integration/int-02c-05a-railway-metadata-query-contract.test.mjs"
      - "docs/integration/int-02c-05b-disposable-execution-adapter.mjs"
      - "docs/integration/int-02c-05b-disposable-execution-adapter.test.mjs"
      - "docs/integration/int-02c-05c-independent-evidence-gate.mjs"
      - "docs/integration/int-02c-05c-independent-evidence-gate.test.mjs"
      - ".github/workflows/int-02c-05a-offline-metadata-contract.yml"

permissions:
  contents: read

jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test static metadata contract without DB connection
        run: node --test docs/integration/int-02c-05a-railway-metadata-query-contract.test.mjs docs/integration/int-02c-05b-disposable-execution-adapter.test.mjs docs/integration/int-02c-05c-independent-evidence-gate.test.mjs
