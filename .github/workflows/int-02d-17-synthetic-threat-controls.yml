name: INT-02D-17 synthetic inspection controls

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/integration/int-02d-17-synthetic-threat-controls.test.mjs"
      - "docs/integration/int-02d-17-synthetic-test-handoff.md"
      - ".github/workflows/int-02d-17-synthetic-threat-controls.yml"

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test synthetic fail-closed rules without database access
        run: node --test docs/integration/int-02d-17-synthetic-threat-controls.test.mjs
