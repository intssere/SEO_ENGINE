name: PILOT-01 RT01-A12.6 source compatibility audit

on:
  pull_request:
    paths:
      - '.github/workflows/pilot-01-rt01a12-6-source-audit.yml'
      - 'lib/db/src/pilot-01-rt01a12-6-source-compat-audit.ts'
      - 'lib/db/src/pilot-01-rt01a12-6-source-compat-audit.test.ts'
      - 'docs/pilot-01-rt01a12-6-source-compat-security-readiness.md'
      - 'lib/db/migrations/**'
      - 'docs/sql-candidates/rt01-a12-1-pilot01-additive.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run source-only negative compatibility audit
        env:
          PUBLIC_SITE_WRITES_ENABLED: 'false'
          AI_PROPOSAL_GENERATION_ENABLED: 'false'
        run: pnpm --filter @workspace/db exec tsx --test src/pilot-01-rt01a12-6-source-compat-audit.test.ts
