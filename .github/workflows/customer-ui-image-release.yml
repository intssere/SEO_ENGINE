name: Customer UI immutable image release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact tested GitHub main commit (40 hexadecimal characters)
        required: true
        type: string
      source_tree:
        description: Exact canonical tree SHA (40 hexadecimal characters)
        required: true
        type: string
      authorization:
        description: Exact bounded customer UI image-release authorization literal
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: customer-ui-image-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/intssere/seo-engine
    steps:
      - name: Checkout main release workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify dispatch, source identity and successful main CI
        id: identity
        shell: bash
        env:
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
          SOURCE_TREE_INPUT: ${{ inputs.source_tree }}
          AUTHORIZATION_INPUT: ${{ inputs.authorization }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          [[ "$SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE_INPUT" =~ ^[0-9a-f]{40}$ ]]
          test "$AUTHORIZATION_INPUT" = "AUTHORIZE:CUSTOMER_UI_IMAGE_RELEASE:${SOURCE_SHA_INPUT}:${SOURCE_TREE_INPUT}"
          # Full-history checkout provides origin/main without a second authenticated fetch.
          git merge-base --is-ancestor "$SOURCE_SHA_INPUT" origin/main
          test "$(git rev-parse "${SOURCE_SHA_INPUT}^{tree}")" = "$SOURCE_TREE_INPUT"
          # No release without successful, exact-head push-triggered main CI.
          export RUNS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA_INPUT}&event=push&per_page=100")"
          node -e '
            const d = JSON.parse(process.env.RUNS_JSON);
            if (!d.workflow_runs?.some(r => r.name === "CI" && r.event === "push" &&
              r.head_sha === process.env.SOURCE_SHA_INPUT && r.status === "completed" &&
              r.conclusion === "success")) process.exit(1);
          '
          git checkout --detach "$SOURCE_SHA_INPUT"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA_INPUT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE_INPUT"
          test -z "$(git status --porcelain)"
          echo "source_sha=$SOURCE_SHA_INPUT" >> "$GITHUB_OUTPUT"
          echo "source_tree=$SOURCE_TREE_INPUT" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build and publish exact tested source
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            EXPECTED_CANONICAL_COMMIT=${{ steps.identity.outputs.source_sha }}
            EXPECTED_CANONICAL_TREE=${{ steps.identity.outputs.source_tree }}
            EXPECTED_SOURCE_BRANCH=main
          tags: ghcr.io/intssere/seo-engine:customer-ui-sha-${{ steps.identity.outputs.source_sha }}

      - name: Attest immutable digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/intssere/seo-engine
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify pushed image and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          TAG="$IMAGE:customer-ui-sha-${{ steps.identity.outputs.source_sha }}"
          DIGEST="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$DIGEST"
          test "$DIGEST" = "${{ steps.build.outputs.digest }}"
          {
            echo "source_sha=${{ steps.identity.outputs.source_sha }}"
            echo "source_tree=${{ steps.identity.outputs.source_tree }}"
            echo "image=$IMAGE@$DIGEST"
            echo "railway_deployed=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
