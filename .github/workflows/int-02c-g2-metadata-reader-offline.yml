name: INT-02C-G2 restricted metadata reader design offline
on:
  pull_request:
    paths:
      - '.github/workflows/int-02c-g2-metadata-reader-offline.yml'
      - 'docs/integration/int-02c-g2-metadata-reader*'
      - 'docs/integration/int-02c-05a-railway-metadata-query-contract.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-design:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Run offline privilege and independent custody negative tests
        run: node --test docs/integration/int-02c-g2-metadata-reader-design.test.mjs
