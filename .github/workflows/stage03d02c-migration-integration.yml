name: STAGE-03D-02C complete migration integration
on:
  pull_request:
    paths:
      - "scripts/stage03d02a/**"
      - "Dockerfile.stage03d02a-cert"
      - ".github/workflows/stage03d02c-migration-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stage03d02c_ephemeral
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d stage03d02c_ephemeral"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/stage03d02c_ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply full SQL sequence on isolated ephemeral database
        shell: bash
        run: |
          set -euo pipefail
          expected=(29 31 34 37 38 41 43 44 44 47 49)
          i=0
          for migration in lib/db/migrations/00{01,02,03,04,05,06,07,08,09,10,11}_*.sql; do
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
            actual="$(psql "$DATABASE_URL" -X -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
            test "$actual" = "${expected[$i]}"
            echo "migration $(basename "$migration") table_count=$actual PASS"
            i=$((i+1))
          done
          test "$i" -eq 11
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "
            INSERT INTO organizations(name,slug) VALUES('Diamond Shelf Trading LLC','diamond-shelf-trading');
            INSERT INTO sites(organization_id,name,domain,canonical_origin,platform,locale,timezone,is_active)
            SELECT id,'Diamond Shelf','diamondshelf.us','https://diamondshelf.us','shopify','en-US','America/Chicago',true
            FROM organizations WHERE slug='diamond-shelf-trading';
          " >/dev/null
          test "$(psql "$DATABASE_URL" -At -c "SELECT COUNT(*) FROM sites WHERE domain='diamondshelf.us' AND is_active=true")" -eq 1
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "
            BEGIN;
            INSERT INTO auth_sessions(token_hash,subject,email,role,csrf_token_hash,expires_at)
            VALUES('stage03d02c_fake','synthetic','test@example.invalid','viewer','fake_csrf',NOW()+INTERVAL '10 minutes');
            DO \$\$BEGIN
              IF (SELECT COUNT(*) FROM auth_sessions WHERE token_hash='stage03d02c_fake' AND revoked_at IS NULL) <> 1
              THEN RAISE EXCEPTION 'auth_create_read_failed'; END IF;
            END\$\$;
            UPDATE auth_sessions SET revoked_at=NOW() WHERE token_hash='stage03d02c_fake';
            DO \$\$BEGIN
              IF (SELECT COUNT(*) FROM auth_sessions WHERE token_hash='stage03d02c_fake' AND revoked_at IS NULL) <> 0
              THEN RAISE EXCEPTION 'auth_revoke_failed'; END IF;
            END\$\$;
            ROLLBACK;
          " >/dev/null
          echo "COMPLETE_CHAIN_AND_SYNTHETIC_SESSION_PASS"
