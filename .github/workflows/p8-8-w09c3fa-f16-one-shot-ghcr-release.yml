name: P8.8 W09-C3F-A-F16 one-shot GHCR release

on:
  push:
    branches:
      - p8-8-w09c3fa-f16-one-shot-ghcr-release
    paths:
      - .github/workflows/p8-8-w09c3fa-f16-one-shot-ghcr-release.yml

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: intssere/seo-engine
  EXPECTED_CANONICAL_COMMIT: 9ba3640d8f50843da8609608124918fa356d552c
  EXPECTED_CANONICAL_TREE: 75b750b59f2de907a121c61907c2f1cfe7364c1f
  EXPECTED_SOURCE_BRANCH: main
  IMAGE_TAG: sha-9ba3640d8f50843da8609608124918fa356d552c

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact certified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9ba3640d8f50843da8609608124918fa356d552c
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANONICAL_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_CANONICAL_TREE"
          test "$(git rev-parse --abbrev-ref HEAD)" = "HEAD"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push exact single-platform image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            EXPECTED_CANONICAL_COMMIT=9ba3640d8f50843da8609608124918fa356d552c
            EXPECTED_CANONICAL_TREE=75b750b59f2de907a121c61907c2f1cfe7364c1f
            EXPECTED_SOURCE_BRANCH=main
          tags: ghcr.io/intssere/seo-engine:sha-9ba3640d8f50843da8609608124918fa356d552c

      - name: Attest exact pushed digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/intssere/seo-engine
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Emit release receipt
        shell: bash
        run: |
          set -euo pipefail
          echo "source_commit=$EXPECTED_CANONICAL_COMMIT"
          echo "source_tree=$EXPECTED_CANONICAL_TREE"
          echo "source_branch=$EXPECTED_SOURCE_BRANCH"
          echo "image=ghcr.io/intssere/seo-engine:$IMAGE_TAG"
          echo "digest=${{ steps.build.outputs.digest }}"
