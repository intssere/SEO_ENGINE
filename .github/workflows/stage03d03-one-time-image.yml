name: STAGE-03D-03 one-time staging migration runner image
on:
  push:
    branches: [workstream/stage03d02a-staging-migration-runner-20261012]
    paths: [".github/workflows/stage03d03-one-time-image.yml"]
permissions:
  contents: read
jobs:
  publish-one-time:
    if: github.ref == 'refs/heads/workstream/stage03d02a-staging-migration-runner-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      SOURCE_SHA: fef5a3e2c0cb900eb7db29220a728a4ba46e898f
      TESTED_SHA: 65838fea86b70e10937b8edaf0aced5b1287c5e5
      IMAGE: ghcr.io/intssere/seo-engine-stage03d03-runner
    steps:
      - name: Checkout exact reviewed PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fef5a3e2c0cb900eb7db29220a728a4ba46e898f
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source and prior successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$TESTED_SHA" "$SOURCE_SHA"
          test "$(git rev-parse "$TESTED_SHA:scripts/stage03d02a/staging-migration-cert.mjs")" = "$(git rev-parse "$SOURCE_SHA:scripts/stage03d02a/staging-migration-cert.mjs")"
          test "$(git rev-parse "$TESTED_SHA:Dockerfile.stage03d02a-cert")" = "$(git rev-parse "$SOURCE_SHA:Dockerfile.stage03d02a-cert")"
          for id in 38262285356 38262285403 38262285336; do
            j="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '[.head_sha,.status,.conclusion]|join(" ")')"
            test "$j" = "$TESTED_SHA completed success"
          done
      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build and publish pinned runner image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.stage03d02a-cert
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/intssere/seo-engine-stage03d03-runner:sha-fef5a3e2c0cb900eb7db29220a728a4ba46e898f
      - name: Verify pushed digest and summarize
        run: |
          set -euo pipefail
          TAG="$IMAGE:sha-$SOURCE_SHA"
          DIGEST="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$DIGEST" = "${{ steps.image.outputs.digest }}"
          echo "image=$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
