name: UX-CH Cross-browser Certification

on:
  workflow_dispatch:
  push:
    branches:
      - workstream/ux-ch-recovery-customer-home-v1
    paths:
      - '.github/workflows/ux-ch-cross-browser.yml'
      - 'artifacts/seo-engine/**'

permissions:
  contents: read

concurrency:
  group: ux-ch-cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      CI: "true"
      UX_CH_CROSS_BROWSER: "1"
      UX_CH_PRODUCTION_PREVIEW: "1"
      PORT: "4174"
      BASE_PATH: "/"
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install only selected browser and OS dependencies
        run: pnpm --filter @workspace/seo-engine exec playwright install --with-deps ${{ matrix.browser }}
      - name: Build production assets and enforce unchanged performance budgets
        run: pnpm --filter @workspace/seo-engine run build
      - name: Run synthetic customer routes on selected browser
        run: pnpm --filter @workspace/seo-engine exec playwright test e2e/ux-ch-browser-compat.spec.mjs --project=${{ matrix.browser }}
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-ch-${{ matrix.browser }}-failure
          path: |
            artifacts/seo-engine/test-results/
            artifacts/seo-engine/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
